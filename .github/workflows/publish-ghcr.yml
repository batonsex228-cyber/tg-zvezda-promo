name: Dual Telegram bots - tests and GHCR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zvezdochka requirements
        run: python -m pip install -r bots/zvezdochka/requirements.txt
      - name: Zvezdochka tests
        working-directory: bots/zvezdochka
        run: |
          python scripts/local_self_test.py
          python scripts/telegram_flow_test.py
          python scripts/telegram_social_reply_test.py
          python scripts/semantic_regression_test.py
          python scripts/context_20_test.py
          python scripts/telegram_semantic_flow_test.py
          python scripts/telegram_cloudflare_proxy_test.py
          node google_apps_script/self_test.js
      - name: Install release-check YAML parser
        run: python -m pip install "PyYAML>=6,<7"
      - name: Tourist transport and dual stack checks
        run: python scripts/dual_release_check.py
      - name: Install Tourist requirements and QA tools
        run: python -m pip install -r bots/tourist/requirements.txt -r bots/tourist/requirements-dev.txt
      - name: Tourist regression suite
        working-directory: bots/tourist
        run: python -m pytest tests -q

  publish:
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image namespace
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Zvezdochka
        uses: docker/build-push-action@v6
        with:
          context: ./bots/zvezdochka
          file: ./bots/zvezdochka/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:zvezdochka-latest
            ${{ env.IMAGE }}:zvezdochka-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Zvezdochka Telegram bot
      - name: Build and push Tourist
        uses: docker/build-push-action@v6
        with:
          context: ./bots/tourist
          file: ./bots/tourist/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:tourist-latest
            ${{ env.IMAGE }}:tourist-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Tourist Telegram bot and Mini App
